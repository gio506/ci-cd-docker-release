name: ci-cd-docker-release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: bash -n scripts/*.sh

  yamllint:
    runs-on: ubuntu-latest
    needs: shell-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Lint YAML files
        run: yamllint -c .yamllint.yml docker-compose.yml .github/workflows/ci-cd-docker-release.yml .yamllint.yml

  compose-up:
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start LocalStack
        run: ./scripts/up.sh

      - name: Verify health endpoint
        run: curl -fsS http://localhost:4566/_localstack/health

      - name: Teardown
        if: always()
        run: ./scripts/down.sh --purge

  smoke:
    runs-on: ubuntu-latest
    needs: compose-up
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Start LocalStack
        run: ./scripts/up.sh

      - name: Run smoke checks
        run: ./scripts/smoke.sh

      - name: Teardown
        if: always()
        run: ./scripts/down.sh --purge
