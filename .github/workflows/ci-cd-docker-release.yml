name: ci-cd-docker-release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: local/ci-cd-docker-release:ci
          outputs: type=docker,dest=/tmp/image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: /tmp/image.tar

  smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/image.tar
      - name: Run container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e APP_VERSION=smoke \
            -e GIT_SHA=smoke-sha \
            local/ci-cd-docker-release:ci
      - name: Smoke check /health
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy" >&2
          docker logs smoke
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  tag-version:
    runs-on: ubuntu-latest
    needs: smoke-test
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Generate image tags
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          VERSION="sha-${SHA_TAG}"
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TAGS+=$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            TAGS+=$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}"
          fi

          {
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  push-image:
    runs-on: ubuntu-latest
    needs: tag-version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.tag-version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ needs.tag-version.outputs.tags }}
