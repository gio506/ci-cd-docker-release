name: ci-cd-docker-release

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-docker-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    name: Stage 1 - Structure check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "CHEATSHEET.md"
            "FILES_EXPLAINED.md"
            "docker-compose.yml"
            "scripts/up.sh"
            "scripts/seed.sh"
            "scripts/smoke.sh"
            "scripts/down.sh"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

  shell-check:
    name: Stage 2 - Shell syntax
    runs-on: ubuntu-latest
    needs: structure-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: bash -n scripts/*.sh

  yamllint:
    name: Stage 3 - YAML lint
    runs-on: ubuntu-latest
    needs: shell-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Lint YAML files
        run: yamllint -c .yamllint.yml docker-compose.yml .github/workflows/ci-cd-docker-release.yml .yamllint.yml

  compose-up:
    name: Stage 4 - Compose up
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start LocalStack
        run: ./scripts/up.sh

      - name: Verify health endpoint
        run: curl -fsS http://localhost:4566/_localstack/health

      - name: Teardown
        if: always()
        run: ./scripts/down.sh --purge

  smoke:
    name: Stage 5 - Service smoke
    runs-on: ubuntu-latest
    needs: compose-up
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Start LocalStack
        run: ./scripts/up.sh

      - name: Run smoke checks
        run: ./scripts/smoke.sh

      - name: Teardown
        if: always()
        run: ./scripts/down.sh --purge

  final-status-gate:
    name: Stage 6 - Final status gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - structure-check
      - shell-check
      - yamllint
      - compose-up
      - smoke
    steps:
      - name: Aggregate results
        shell: bash
        env:
          STRUCTURE: ${{ needs.structure-check.result }}
          SHELL: ${{ needs.shell-check.result }}
          YAML: ${{ needs.yamllint.result }}
          COMPOSE: ${{ needs.compose-up.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          for result in "$STRUCTURE" "$SHELL" "$YAML" "$COMPOSE" "$SMOKE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
