name: ci-cd-docker-release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ci-cd-docker-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image archive for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          tags: local/ci-cd-docker-release:ci
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: /tmp/image.tar
          retention-days: 1

  smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 10
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Run container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e APP_VERSION=smoke \
            -e GIT_SHA=smoke-sha \
            local/ci-cd-docker-release:ci

      - name: Smoke check /health
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health

      - name: Smoke check /version
        run: |
          body="$(curl -fsS http://localhost:8000/version)"
          echo "$body"
          echo "$body" | grep -q '"version":"smoke"'
          echo "$body" | grep -q '"commit":"smoke-sha"'

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  tag-version:
    runs-on: ubuntu-latest
    needs: smoke-test
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Docker metadata (SHA + semver)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=tag,pattern=v{{version}}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}

      - name: Resolve app version
        id: version
        run: |
          VERSION="sha-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

  push-image:
    runs-on: ubuntu-latest
    needs: tag-version
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          build-args: |
            APP_VERSION=${{ needs.tag-version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ needs.tag-version.outputs.tags }}
